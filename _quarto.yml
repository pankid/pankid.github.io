format:
  html:
    theme:
      light: [cerulean, styles.scss]
      dark: darkly
    toc: true            # 启用目录
    toc-position: right  # 将目录放置在页面的右侧
    toc-depth: 3         # 设置目录的深度，数字越大，目录越详细
    reading-time: true        # 显示阅读时间
    word-count: true          # 显示字数统计
    respect-user-color-scheme: true
    link-external-newwindow: true
    link-external-icon: true