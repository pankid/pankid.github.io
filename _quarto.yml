project:
  type: website
  output-dir: docs

# metadata-files: 
#   - _listing_defaults.yml

execute:
  freeze: auto

lang: zh-CN
language: 
  search-text-placeholder: "Search..."

website:
  announcement: 
    icon: info-circle
    dismissable: true
    content: "**欢迎访问pankid的个人网站!**"
    type: success
    position: below-navbar
  google-analytics: "G-CGSQJSRMXB"

  page-navigation: true
  title: "pankid"
  site-url: https://pankid.github.io
  description: "pankid的个人网站"
  favicon: images/wukong5-site.jpg
  search: 
    location: navbar
    type: textbox
    copy-button: true
    show-item-context: tree

  reader-mode: true                                           # 启用阅读模式
  bread-crumbs: true                                          # 引导用户了解正在阅读的内容处于网站什么位置
  back-to-top-navigation: true                                # 页面底部加一个“返回顶部”按钮

  repo-url: https://github.com/pankid/pankid.github.io
  repo-actions: [edit, source, issue]
  page-footer: 
    center: 
      "“我们在日常生活中度过的每一天，实际上也许是连续发生的奇迹也说不定呢。”"
    left: |
      [pankid](https://pankid.netlify.app)<br>
    right: |
      Made with [Quarto](https://quarto.org)<br>

  navbar: 
    logo: images/wukong5.jpeg
    background: primary
    pinned: true
    search: true
    left: 
      - text: "Publications"
        icon: journals
        href: publications.qmd
        target: _blank
      - text: "Books"
        icon: book
        href: books.qmd
        target: _blank
      - text: "Blogs"
        icon: file-post
        href: posts/blog.qmd
        target: _blank
      - text: "Codes"
        icon: code
        href: codes.qmd
        target: _blank
      - text: "CV"
        icon: person-vcard
        href: about.qmd
        target: _blank
      - text: "Gallery"
        icon: camera
        menu:
          - text: "Photography"
            icon: camera-fill
            href: gallery\photography\photography.qmd
            target: _blank
          - text: "Pictures"
            icon: image
            href: gallery\pictures\pictures.qmd
            target: _blank
          - text: "Videos"
            icon: play-btn
            href: gallery\videos\videos.qmd
            target: _blank
      - text: "More"
        icon: three-dots
        menu: 
          - text: "Help"
            icon: info-circle
            href: help.qmd
            target: _blank
          - text: "Q&A"
            icon: chat-dots
            href: Q&A.qmd
            target: _blank
          - text: "Ask a Question"
            icon: question-circle
            href: https://github.com/pankid/pankid.github.io/issues
            target: _blank
    right: 
      - icon: github
        href: https://github.com
        target: _blank
      - icon: google
        href: https://www.google.com
        target: _blank
      - icon: youtube
        href: https://www.youtube.com
        target: _blank
      - icon: rss
        href: index.xml
        target: _blank
  
  sidebar: 
    - title: "Gallery"
      style: "floating"
      background: light
      collapse-level: 3
      alignment: center
      contents: gallery

    - title: "Blogs"
      contents: posts

    - title: "Publications"
      contents: 
        - publications.qmd
    - title: "Books"
      contents: 
        - books.qmd

