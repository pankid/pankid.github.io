listing: 
  type: default
  contents: posts
  sort: 
    - "date desc"
    - "title desc"
  sort-ui: true
  filter-ui: true
  date-format: "YYYY-MM-DD dddd HH:mm"
  categories: numbered
  page-size: 10
  fields: 
    - image
    - title
    - subtitle
    - author
    - date
    - description
    - categories
    - reading-time
    - word-count
    - file-modified

