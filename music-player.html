<!-- music-player.html -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
<div id="aplayer"></div>
<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script>
    (function () {
        const BASE = '';   // 改成你的仓库名；用户站点填 ''

        function init() {
            if (typeof APlayer === 'undefined') {
                console.warn('APlayer 未加载，检查 CDN');
                return;
            }
            new APlayer({
                container: document.getElementById('aplayer'),
                listFolded: true,
                autoplay: false,
                loop: 'all',
                volume: 0.5,
                lrcType: 3,
                audio: [
                    {
                        name: '把回忆拼好给你',
                        artist: '王贰浪',
                        url: '/assets/audio/把回忆拼好给你-王贰浪.flac',
                        cover: '/images/wukong5.jpeg',
                        lrc: '/assets/audio/把回忆拼好给你-王贰浪.lrc'
                    },
                    {
                        name: '起风了',
                        artist: '买辣椒也用券',
                        url: '/assets/audio/起风了-买辣椒也用券.flac',
                        cover: 'https://cloudflare-imgbed-cea.pages.dev/file/img/1789908381053_wukong5.jpeg',
                        lrc: '/assets/audio/起风了-买辣椒也用券.lrc'
                    },
                    {
                        name: '白鸽乌鸦相爱的戏码',
                        artist: '潘成（皮卡潘）',
                        url: 'https://cloudflare-imgbed-cea.pages.dev/file/audio/1791359950706_白鸽乌鸦相爱的戏码-潘成（皮卡潘）.flac',
                        cover: 'https://cloudflare-imgbed-cea.pages.dev/file/img/1789908381053_wukong5.jpeg',
                        lrc: 'https://cloudflare-imgbed-cea.pages.dev/file/audio/1791359947394_白鸽乌鸦相爱的戏码-潘成（皮卡潘）.lrc'
                    }
                ]
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
